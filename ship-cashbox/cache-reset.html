<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ship Cashbox cache reset</title>
  <style>
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      background: #f7f3ea;
      color: #10243a;
      font: 16px/1.45 sans-serif;
    }
  </style>
</head>
<body>
  <p>Updating Ship Cashbox...</p>
  <script>
    (async function resetShipCashboxCache() {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith("ship-cashbox-shell-")).map((key) => caches.delete(key)));
        }
        localStorage.removeItem("ship_cashbox_shell_purge_v1");
      } catch (error) {}
      window.location.replace("./index.html?reload=20260606-cashbox-layout-stabilize-104&cache-reset=" + Date.now());
    })();
  </script>
</body>
</html>
